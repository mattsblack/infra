compilers:
  racket:
    type: script
    check_exe: bin/racket --version
    dir: racket/racket-{{name}}
    fetch:
      - https://download.racket-lang.org/releases/{{name}}/installers/racket-{{name}}-x86_64-linux-cs.sh racket-{{name}}.sh
    script: |
      sh racket-{{name}}.sh --in-place --dest ./racket/racket-{{name}}
      racket/racket-{{name}}/bin/raco pkg install -i --deps force --no-setup disassemble
      racket/racket-{{name}}/bin/raco setup --no-docs disassemble machine-code
    targets:
      - "9.3"
      - "9.2"
      - "9.1"
      - "9.0"
      - name: "8.18"
        fetch:
          - https://download.racket-lang.org/installers/{{name}}/racket-{{name}}-x86_64-linux-buster-cs.sh racket-{{name}}.sh
      - "8.17"
      - "8.16"
      - "8.15"
      - "8.14"
      - "8.13"
      - "8.12"
      - "8.11.1"
      - "8.11"
      - "8.10"
      - "8.9"
      - "8.8"
      - "8.7"
      - "8.6"
      - "8.5"
      - "8.4"
      - "8.3"
      - "8.2"
      - "8.1"
      - "8.0"
      - "7.9"
      - "7.8"
      - "7.7"
      - "7.6"
      - "7.5"
      - "7.4"
      - name: "7.3"
        fetch: &racket_linux
          - https://download.racket-lang.org/installers/{{name}}/racket-{{name}}-x86_64-linux.sh racket-{{name}}.sh
      - name: "7.2"
        fetch: *racket_linux
      - name: "7.1"
        fetch: *racket_linux
      - name: "7.0"
        fetch: *racket_linux
      - name: "6.12"
        fetch: *racket_linux
        script: &racket_script_bc_disassemble |
          sh racket-{{name}}.sh --in-place --dest ./racket/racket-{{name}}
          racket/racket-{{name}}/bin/raco pkg install -i --deps force --no-setup github://github.com/samth/disassemble/00d2980ae1f2bdb09c74c1a069c3812b1e9ad0e5
          racket/racket-{{name}}/bin/raco setup --no-docs disassemble
      - name: "6.11"
        fetch: *racket_linux
        script: *racket_script_bc_disassemble
      - name: "6.10.1"
        fetch: *racket_linux
        script: *racket_script_bc_disassemble
      - name: "6.10"
        fetch: *racket_linux
        script: *racket_script_bc_disassemble
      - name: "6.9"
        fetch: *racket_linux
        script: *racket_script_bc_disassemble
      - name: "6.8"
        fetch: *racket_linux
        script: *racket_script_bc_disassemble
      - name: "6.7"
        fetch: *racket_linux
        script: *racket_script_bc_disassemble
      - name: "6.6"
        fetch: *racket_linux
        script: *racket_script_bc_disassemble
      - name: "6.5"
        fetch: *racket_linux
        script: &racket_script_bc_no_ssl |
          sh racket-{{name}}.sh --in-place --dest ./racket/racket-{{name}}
          mkdir -p ./racket/racket-{{name}}/collects/disassemble
          curl -fsSL https://github.com/samth/disassemble/archive/00d2980ae1f2bdb09c74c1a069c3812b1e9ad0e5.tar.gz | tar -xz --strip-components=1 -C ./racket/racket-{{name}}/collects/disassemble
      - name: "6.4"
        fetch: &racket_precise
          - https://download.racket-lang.org/installers/{{name}}/racket-{{name}}-x86_64-linux-ubuntu-precise.sh racket-{{name}}.sh
        script: *racket_script_bc_no_ssl
      - name: "6.3"
        fetch: *racket_precise
        script: *racket_script_bc_no_ssl
      - name: "6.2.1"
        fetch: *racket_precise
        script: *racket_script_bc_no_ssl
      - name: "6.2"
        fetch: *racket_precise
        script: *racket_script_bc_no_ssl
      - name: "6.1.1"
        fetch: *racket_precise
        script: *racket_script_bc_no_ssl
      - name: "6.1"
        fetch: *racket_precise
        script: *racket_script_bc_no_ssl
      - name: "6.0.1"
        fetch: *racket_precise
        script: &racket_script_bc_interactive |
          mkdir -p ./racket
          printf 'no\n./racket/racket-{{name}}\n\n' | sh racket-{{name}}.sh
          mkdir -p ./racket/racket-{{name}}/collects/disassemble
          curl -fsSL https://github.com/samth/disassemble/archive/00d2980ae1f2bdb09c74c1a069c3812b1e9ad0e5.tar.gz | tar -xz --strip-components=1 -C ./racket/racket-{{name}}/collects/disassemble
      - name: "6.0"
